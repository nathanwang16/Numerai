[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numerai-stack"
version = "0.1.0"
description = "Numerai Classic (v5.2) research + deployment stack"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numerapi>=2.20",
    "pandas>=2.2,<3",
    "numpy<2.3",
    "pyarrow>=15",
    "scipy>=1.13",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.5,<5",
    "xgboost>=2.1",
    "catboost>=1.2",
    "cloudpickle>=3",
    "optuna>=3.6",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pyyaml>=6",
]

[project.optional-dependencies]
nn = ["torch>=2.4"]

[tool.setuptools]
packages = ["numerai_stack",
            "numerai_stack.data",
            "numerai_stack.cv",
            "numerai_stack.models",
            "numerai_stack.stack",
            "numerai_stack.pipeline",
            "numerai_stack.compute",
            "numerai_stack.tracking"]

[tool.setuptools.package-dir]
numerai_stack = "numerai_stack"
